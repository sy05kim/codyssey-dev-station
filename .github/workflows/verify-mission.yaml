name: Verify Codyssey mission

on:
  push:
    paths:
      - '.github/workflows/verify-mission.yaml'
      - 'Dockerfile'
      - 'nginx/**'
      - 'site/**'
      - 'bind-demo/**'
      - 'scripts/verify.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker practice and collect commands and output
        shell: bash
        run: |
          mkdir -p evidence
          KEEP_RESOURCES=1 bash scripts/verify.sh 2>&1 | tee evidence/docker.txt
      - name: Capture port mapping in Chrome
        shell: bash
        timeout-minutes: 2
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/capture-deps" Pillow
          export PYTHONPATH="$RUNNER_TEMP/capture-deps"
          font_dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
          mkdir -p "$font_dir"
          curl -fsSL --max-time 20 --retry 2 -o "$font_dir/NotoSansKR.ttf" \
            'https://raw.githubusercontent.com/google/fonts/4efc2774c63917927efe769ca845def6bd6debae/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf'
          fc-cache -f "$font_dir"
          xvfb-run -a -s '-screen 0 1280x900x24' python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          import time
          from urllib.request import urlopen

          from PIL import ImageGrab

          url = "http://127.0.0.1:8080/"
          with TemporaryDirectory() as profile, open("evidence/chrome-startup.log", "w") as log:
              browser = subprocess.Popen(
                  [
                      "google-chrome", "--no-sandbox", "--disable-dev-shm-usage",
                      "--no-first-run", "--disable-background-networking",
                      "--test-type", "--disable-features=Translate",
                      "--window-position=0,0", "--window-size=1280,900",
                      "--force-device-scale-factor=1", "--remote-debugging-port=0",
                      f"--user-data-dir={profile}", url,
                  ],
                  stdout=log,
                  stderr=log,
              )
              try:
                  port_file = Path(profile) / "DevToolsActivePort"
                  for attempt in range(30):
                      if port_file.exists():
                          port = port_file.read_text().splitlines()[0]
                          with urlopen(f"http://127.0.0.1:{port}/json/list", timeout=2) as response:
                              pages = json.load(response)
                          if any(page.get("url") == url and "Dev Station" in page.get("title", "") for page in pages):
                              time.sleep(1)
                              ImageGrab.grab(xdisplay=os.environ["DISPLAY"]).save("evidence/browser-8080.png")
                              break
                      time.sleep(1)
                  else:
                      raise RuntimeError(f"Chrome did not finish loading {url}")
              finally:
                  browser.terminate()
                  try:
                      browser.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      browser.kill()
                      browser.wait()

          Path("evidence/chrome-startup.log").unlink()
          PYTHON
      - name: Upload mission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-evidence
          path: evidence/
          if-no-files-found: error
